name: Build Fork Backend

on:
  push:
    tags:
      - 'v*-fork.*'
  workflow_dispatch:

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.25'
          cache: true

      - name: Go test
        run: go test ./...

  build:
    name: Build Backend Binaries
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: write
    strategy:
      matrix:
        include:
          - goos: linux
            goarch: amd64
            output: mmwx-backend-linux-amd64
          - goos: linux
            goarch: arm64
            output: mmwx-backend-linux-arm64
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.25'
          cache: true

      - name: Build Fork Backend
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: 0
          LICENSE_PUB_KEY: ${{ secrets.LICENSE_PUB_KEY }}
        run: |
          if [ -z "$LICENSE_PUB_KEY" ]; then
            echo "::warning::LICENSE_PUB_KEY secret is empty — built binary may reject PRO license responses"
          fi
          go build -trimpath \
            -ldflags="-s -w -X 'miaomiaowux/internal/license.licenseSignPubKeyB64=${LICENSE_PUB_KEY}'" \
            -o build/${{ matrix.output }} ./cmd/server

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.output }}
          path: build/${{ matrix.output }}
          retention-days: 7

  release:
    name: Create Release
    needs: build
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write
    steps:
      - name: Download Linux AMD64 artifact
        uses: actions/download-artifact@v4
        with:
          name: mmwx-backend-linux-amd64
          path: release

      - name: Download Linux ARM64 artifact
        uses: actions/download-artifact@v4
        with:
          name: mmwx-backend-linux-arm64
          path: release

      - name: Add executable permissions
        run: |
          chmod +x release/mmwx-backend-linux-amd64
          chmod +x release/mmwx-backend-linux-arm64

      - name: Create checksums
        run: |
          cd release
          sha256sum mmwx-backend-linux-amd64 mmwx-backend-linux-arm64 > checksums.txt

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          draft: false
          prerelease: false
          generate_release_notes: true
          files: |
            release/mmwx-backend-linux-amd64
            release/mmwx-backend-linux-arm64
            release/checksums.txt
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
